#kubernetes orgonize resources into different api groups 
#for deployment it uses apps api group and the stable version
#used by kubernetes is v1 
# apiVersion: API_GROUP / API_VERSION
apiVersion: apps/v1
kind: Deployment

metadata:
  name: smartcampus

spec:
  replicas: 3

  selector:
    matchLabels:
      app: smartcampus

  template:
    metadata:
      labels:
        app: smartcampus

    spec:
      containers:
        - name: smartcampus
          image: smartcampus:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          volumeMounts :
            - name: smartcampus-vm
              mountPath: /smartcampus/configfile
              readOnly: true 
            - name: secret-vm
              mountPath: /smartcampus/secrets
              readOnly: true 
          startupProbe: #check wehter the container starts
          #While Startup Probe hasn't succeeded, Liveness and Readiness probes are not executed.
            httpGet:
              path: /api/health
              port: 8080
            failureThreshold: 30 #30 consecutive failures before considering startup unsuccessful
            periodSeconds: 10  #time to perform each probe ,check -> fail -> wait 10(seconds) -> check (30 times)
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            periodSeconds: 10 #time to perform the probe 
            timeoutSeconds: 3 #If the application doesn't respond within 3 seconds, the probe fails.
            failureThreshold: 3 #restart the pod 3 times 
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            periodSeconds: 30 #time to perform the probe , if it fails it delete the pod and redirect the traffic 
      #independent volumes from containers 
      volumes:
        - name : smartcampus-vm
          configMap:
            name: smartcampus-cm
        - name : secret-vm
          secret:
            secretName: login-secret